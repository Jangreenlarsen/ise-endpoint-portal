<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>HyperVision ISE Portal — systemkomponenter</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="20" y="150" width="190" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Browser</text>
  <text x="115" y="204" text-anchor="middle" font-size="13" fill="#1e40af">Portal (SPA)</text>
  <text x="115" y="224" text-anchor="middle" font-size="12" fill="#475569">operatører · admins</text>
  <line x1="40" y1="242" x2="190" y2="242" stroke="#bfdbfe"/>
  <text x="115" y="266" text-anchor="middle" font-size="13" fill="#1e40af">/selfregister</text>
  <text x="115" y="286" text-anchor="middle" font-size="12" fill="#475569">gæster (offentlig)</text>

  <!-- Backend -->
  <rect x="290" y="40" width="360" height="390" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="470" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">HyperVision backend (FastAPI)</text>
  <text x="470" y="90" text-anchor="middle" font-size="12" fill="#64748b">eneste komponent der taler med ISE</text>

  <rect x="320" y="108" width="300" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">API-lag</text>
  <text x="470" y="149" text-anchor="middle" font-size="12" fill="#475569">login · roller · System adm-scope</text>

  <rect x="320" y="176" width="300" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Services</text>
  <text x="470" y="217" text-anchor="middle" font-size="12" fill="#475569">PSK-politik · skabeloner · audit · CoA</text>

  <rect x="320" y="244" width="300" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ISE-klient</text>
  <text x="470" y="285" text-anchor="middle" font-size="12" fill="#475569">rate-limit · circuit breaker · retry</text>

  <rect x="480" y="312" width="140" height="96" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="550" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#155e75">Cache</text>
  <text x="550" y="362" text-anchor="middle" font-size="12" fill="#475569">hukommelse + disk</text>
  <text x="550" y="380" text-anchor="middle" font-size="12" fill="#475569">pre-warm worker</text>

  <rect x="320" y="312" width="140" height="96" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="390" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">Lokale data</text>
  <text x="390" y="362" text-anchor="middle" font-size="12" fill="#475569">brugere · audit</text>
  <text x="390" y="380" text-anchor="middle" font-size="12" fill="#475569">app.log</text>

  <line x1="470" y1="160" x2="470" y2="174" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="228" x2="470" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Browser → backend -->
  <line x1="212" y1="235" x2="316" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <text x="248" y="168" font-size="12" fill="#1e40af" transform="rotate(-44 248 168)">HTTPS /api</text>

  <!-- ISE -->
  <rect x="730" y="40" width="210" height="390" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="835" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Cisco ISE 3.4</text>
  <g font-size="13">
    <rect x="750" y="94" width="170" height="52" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="835" y="116" text-anchor="middle" font-weight="600" fill="#14532d">ERS</text>
    <text x="835" y="134" text-anchor="middle" font-size="12" fill="#475569">endpoints · grupper</text>
    <rect x="750" y="160" width="170" height="52" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="835" y="182" text-anchor="middle" font-weight="600" fill="#14532d">Open API</text>
    <text x="835" y="200" text-anchor="middle" font-size="12" fill="#475569">policy · profiler</text>
    <rect x="750" y="226" width="170" height="52" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="835" y="248" text-anchor="middle" font-weight="600" fill="#14532d">MnT</text>
    <text x="835" y="266" text-anchor="middle" font-size="12" fill="#475569">sessioner · CoA</text>
    <rect x="750" y="292" width="170" height="52" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="835" y="314" text-anchor="middle" font-weight="600" fill="#14532d">pxGrid 2.0</text>
    <text x="835" y="332" text-anchor="middle" font-size="12" fill="#475569">live sessions (valgfri)</text>
  </g>
  <text x="835" y="372" text-anchor="middle" font-size="12" fill="#475569">RADIUS mod WLC/switche</text>
  <text x="835" y="390" text-anchor="middle" font-size="12" fill="#475569">håndteres af ISE selv</text>

  <line x1="620" y1="270" x2="746" y2="120" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="270" x2="746" y2="186" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="270" x2="746" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="746" y1="318" x2="624" y2="350" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="660" y="318" font-size="11" fill="#15803d">events</text>

  <!-- TACACS -->
  <rect x="20" y="370" width="190" height="60" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="115" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#581c87">TACACS+ (valgfri)</text>
  <text x="115" y="414" text-anchor="middle" font-size="12" fill="#475569">portal-login</text>
  <line x1="212" y1="400" x2="316" y2="150" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#a)"/>
</svg>
