<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skift af PSK-nøgle med automatisk CoA-Disconnect</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Nøgleskift: den nye nøgle virker med det samme</text>

  <!-- Deltagere -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="50" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="115" y="76" fill="#1e3a8a">Operatør / Portal</text>
    <rect x="270" y="50" width="150" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="345" y="76" fill="#14532d">ISE</text>
    <rect x="500" y="50" width="150" height="40" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="575" y="76" fill="#7c2d12">WLC</text>
    <rect x="720" y="50" width="150" height="40" rx="8" fill="#f8fafc" stroke="#475569"/><text x="795" y="76" fill="#0f172a">Enhed</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="115" y1="90" x2="115" y2="455"/><line x1="345" y1="90" x2="345" y2="455"/>
    <line x1="575" y1="90" x2="575" y2="455"/><line x1="795" y1="90" x2="795" y2="455"/>
  </g>

  <g font-size="12.5" fill="#0f172a">
    <!-- 1 -->
    <rect x="575" y="108" width="220" height="22" rx="4" fill="#f1f5f9"/>
    <text x="685" y="124" text-anchor="middle" fill="#475569">forbundet med gammel nøgle</text>
    <!-- 2 -->
    <line x1="115" y1="160" x2="341" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="228" y="152" text-anchor="middle">① Gem ny PSK_Key (ERS PUT)</text>
    <!-- 3 -->
    <line x1="115" y1="205" x2="341" y2="205" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
    <text x="228" y="197" text-anchor="middle" fill="#b91c1c">② CoA-Disconnect (automatisk)</text>
    <line x1="345" y1="230" x2="571" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
    <text x="460" y="222" text-anchor="middle" fill="#b91c1c">RADIUS Disconnect</text>
    <line x1="575" y1="255" x2="791" y2="255" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
    <text x="685" y="247" text-anchor="middle" fill="#b91c1c">afbrydes</text>
    <!-- 4 -->
    <line x1="795" y1="300" x2="579" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="685" y="292" text-anchor="middle">③ forbinder igen</text>
    <line x1="575" y1="330" x2="349" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="460" y="322" text-anchor="middle">MAB Access-Request</text>
    <line x1="345" y1="365" x2="571" y2="365" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
    <text x="460" y="357" text-anchor="middle" fill="#15803d">Access-Accept + ny nøgle</text>
    <line x1="575" y1="400" x2="791" y2="400" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
    <text x="685" y="392" text-anchor="middle" fill="#15803d">④ WPA2 med ny nøgle</text>
  </g>

  <rect x="30" y="420" width="300" height="40" rx="6" fill="#fefce8" stroke="#ca8a04"/>
  <text x="44" y="437" font-size="11.5" fill="#713f12">Slå fra i PSK-politikken hvis enheden selv</text>
  <text x="44" y="452" font-size="11.5" fill="#713f12">skal konfigureres med nøglen først.</text>
</svg>
