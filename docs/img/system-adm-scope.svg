<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>System adm — hvilke endpoints en operatør kan se og ændre</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">System adm: operatøren ser kun endpoints med sine egne tags</text>

  <!-- Operatør -->
  <rect x="30" y="100" width="230" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Operatør: jens.h</text>
  <text x="145" y="152" text-anchor="middle" font-size="12" fill="#475569">rolle: editor</text>
  <text x="145" y="180" text-anchor="middle" font-size="12" fill="#334155">System adm-roller:</text>
  <rect x="80" y="192" width="70" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="115" y="209" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Facility</text>
  <rect x="158" y="192" width="70" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="193" y="209" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">jens.h</text>

  <!-- Endpoints -->
  <g font-size="12.5">
    <rect x="420" y="60" width="440" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="440" y="84" font-family="Consolas, Menlo, monospace" fill="#0f172a">00:0D:4B:22:31:03</text>
    <text x="440" y="104" fill="#475569">HypervisionRoles = Facility</text>
    <text x="840" y="94" text-anchor="end" font-weight="700" fill="#15803d">se + ændre</text>

    <rect x="420" y="132" width="440" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="440" y="156" font-family="Consolas, Menlo, monospace" fill="#0f172a">B8:27:EB:5C:44:05</text>
    <text x="440" y="176" fill="#475569">HypervisionRoles = Facility, IT</text>
    <text x="840" y="166" text-anchor="end" font-weight="700" fill="#15803d">se + ændre</text>

    <rect x="420" y="204" width="440" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="440" y="228" font-family="Consolas, Menlo, monospace" fill="#0f172a">00:1B:63:4A:10:01</text>
    <text x="440" y="248" fill="#475569">HypervisionRoles = IT</text>
    <text x="840" y="238" text-anchor="end" font-weight="700" fill="#b91c1c">"Endpoint ikke fundet"</text>
  </g>
  <line x1="262" y1="150" x2="416" y2="88" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="262" y1="162" x2="416" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="262" y1="176" x2="416" y2="232" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <text x="30" y="290" font-size="12.5" fill="#334155">Gælder både visning og alle skrivehandlinger (gem, slet, CoA, karantæne, bulk). Admin ser alt.</text>
  <text x="30" y="310" font-size="12.5" fill="#334155">Ved oprettelse kan operatøren kun tildele tags den selv har; uden valg tagges endpointet med brugernavnet.</text>
</svg>
