#
# Nginx reverse proxy config for HyperVision ISE Portal med TLS.
# Kræver certbot: certbot --nginx -d <dit-hostname>
#
# Install: cp deploy/nginx-hypervision.conf /etc/nginx/sites-available/hypervision
#          ln -s /etc/nginx/sites-available/hypervision /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Redirect al HTTP til HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;  # Erstat med dit hostname fx hypervision.eksempel.dk

    # TLS-certifikater — udfyldes automatisk af certbot
    # ssl_certificate     /etc/letsencrypt/live/<hostname>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<hostname>/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Proxy til portalen
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # SSE (pxGrid live-stream) — ingen buffer
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }
}
