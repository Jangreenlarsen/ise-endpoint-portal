<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISE Endpoint Portal</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>ISE Endpoint Portal</h1>
      <div id="status" class="status">backend: <span id="status-dot">...</span></div>
    </header>

    <main>
      <section>
        <div class="section-header">
          <h2>Endpoint Groups</h2>
          <button id="refresh-groups">Refresh</button>
        </div>
        <table id="groups-table">
          <thead>
            <tr><th>Name</th><th>ID</th><th>Description</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <div class="section-header">
          <h2>Endpoints</h2>
          <button id="refresh-endpoints">Refresh</button>
        </div>
        <table id="endpoints-table">
          <thead>
            <tr><th>Name (MAC)</th><th>ID</th><th>Description</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
