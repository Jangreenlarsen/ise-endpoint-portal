<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperVision ISE Portal</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">HyperVision ISE Portal</div>
        <nav>
          <a href="#/create" data-view="create">Opret endpoint</a>
          <a href="#/import" data-view="import">Import fra CSV</a>
          <a href="#/browse" data-view="browse">Browse / Edit</a>
          <a href="#/attributes" data-view="attributes">Attributter</a>
          <a href="#/logs" data-view="logs">Log</a>
          <a href="#/settings" data-view="settings">Settings</a>
        </nav>
        <div class="backend-status">
          backend: <span id="status-dot">...</span>
          <div id="version-info" class="version-label"></div>
          <div id="user-info" class="user-info" hidden>
            <span id="user-name"></span>
            <span id="user-role" class="role-badge"></span>
            <button id="logout-btn" class="linkish" type="button">Log ud</button>
          </div>
        </div>
      </aside>
      <main class="content" id="view-container"></main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
