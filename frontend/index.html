<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d91" />
    <title>HyperVision ISE Portal</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">HyperVision ISE Portal</div>
        <nav>
          <a href="#/register" data-view="register">Opret endpoint</a>
          <a href="#/import" data-view="import">Import fra CSV</a>
          <a href="#/csv-template" data-view="csv-template" class="nav-sub">CSV Export Template</a>
          <a href="#/browse" data-view="browse">Browse / Edit</a>
          <a href="#/attributes" data-view="attributes">Attributter</a>
          <a href="#/dacls" data-view="dacls">DACL</a>
          <a href="#/logs" data-view="logs">Log</a>
          <a href="#/audit" data-view="audit">Audit</a>
          <a href="#/metrics" data-view="metrics">Metrics</a>
          <a href="#/settings" data-view="settings">Settings</a>
        </nav>
        <div class="backend-status">
          backend: <span id="status-dot">...</span>
          <div id="version-info" class="version-label"></div>
          <div id="user-info" class="user-info" hidden>
            <span id="user-name"></span>
            <span id="user-role" class="role-badge"></span>
            <button id="logout-btn" class="linkish" type="button">Log ud</button>
            <a href="#/user-prefs" class="linkish user-prefs-link">Præferencer</a>
          </div>
        </div>
      </aside>
      <main class="content" id="view-container"></main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
